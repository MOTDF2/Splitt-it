<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2856E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="splitt’it">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Splitt'it — Gruppenkasse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF3FC;
    --bg-accent-1:#DCE7FB;
    --card:#FFFFFF;
    --primary:#2856E8;
    --primary-dark:#1B3FBD;
    --primary-darker:#132E8C;
    --primary-soft:#E8EEFF;
    --primary-soft-2:#D6E1FE;
    --ink:#101A34;
    --ink-muted:#66708C;
    --border:#DFE6F7;
    --positive:#0E9F6E;
    --positive-soft:#E4F8F0;
    --negative:#E1493D;
    --negative-soft:#FCEAE8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 500px at 15% -10%, var(--bg-accent-1) 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #CFE0FF 0%, transparent 55%),
      var(--bg);
    min-height:100vh;
    font-family:'Inter', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:40px 16px 110px;
  }
  .receipt-wrap{ width:100%; max-width:440px; }
  .toothed{ display:none; }
  .receipt{
    background:var(--card);
    border-radius:28px;
    box-shadow: 0 1px 2px #10193408, 0 24px 48px -18px #1B3FBD33, 0 0 0 1px #FFFFFF;
    padding: 30px 26px 8px;
  }
  header.masthead{
    text-align:center;
    position:sticky; top:0; z-index:30;
    background:var(--card);
    margin:-30px -26px 18px;
    padding:34px 26px 18px;
    border-radius:28px 28px 0 0;
    border-bottom: 1px solid var(--border);
  }
  .group-head{
    position:sticky; top:var(--head-h, 100px); z-index:20;
    background:var(--card);
    margin:-6px -26px 0; padding:6px 26px 2px;
  }
  .group-head .tab-nav{ margin:12px 0 10px; }
  .group-head::after{ content:""; display:block; height:1px; background:var(--border); margin:0 -26px; }
  .back-btn{
    position:absolute;
    left:26px; top:32px;
    background:var(--primary-soft);
    border:none;
    color:var(--primary-dark);
    font-family:'Inter', sans-serif;
    font-size:13px; font-weight:600;
    padding:7px 12px;
    border-radius:20px;
    cursor:pointer;
    display:none;
    align-items:center;
    gap:4px;
  }
  .back-btn:hover{ background:var(--primary-soft-2); }
  .back-btn.show{ display:inline-flex; }
  .wordmark{
    font-family:'Manrope', sans-serif;
    font-weight:800;
    font-size:26px;
    letter-spacing:-0.5px;
    margin:0;
    background:linear-gradient(135deg, var(--primary) 0%, var(--primary-darker) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .wordmark .dot{
    -webkit-text-fill-color: var(--primary);
    color:var(--primary);
  }
  .subtitle{
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.4px;
    color:var(--ink-muted);
    margin-top:6px;
  }
  #storageStatus{ font-size:12px; text-align:center; margin:0 0 10px; }
  .section-title{
    font-family:'Manrope', sans-serif;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.6px;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin: 24px 0 12px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .section-title::after{ content:""; flex:1; border-bottom:1px solid var(--border); }
  .members-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .chip{
    display:flex; align-items:center; gap:7px;
    background:var(--primary-soft); border:1px solid var(--primary-soft-2); border-radius:20px;
    padding:6px 6px 6px 14px; font-size:13.5px; font-weight:500; color:var(--primary-darker);
  }
  .chip button{
    border:none; background:#FFFFFFAA; color:var(--primary-dark);
    width:19px;height:19px; border-radius:50%; font-size:12px; line-height:1; cursor:pointer;
  }
  .chip button:hover{ background:#FFFFFF; }
  .add-member-row{ display:flex; gap:8px; margin-bottom:6px; }
  input, select{
    font-family:'Inter', sans-serif; font-size:14.5px;
    padding:11px 13px; border:1.5px solid var(--border); border-radius:12px;
    background:#FAFBFF; color:var(--ink); width:100%;
    transition:border-color .15s ease, background .15s ease;
  }
  input:focus, select:focus{
    outline:none; border-color:var(--primary); background:#fff;
    box-shadow:0 0 0 4px var(--primary-soft);
  }
  button:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }
  .btn{
    font-family:'Inter', sans-serif; font-weight:700; font-size:13.5px;
    border:none; border-radius:12px; padding:11px 16px; cursor:pointer; white-space:nowrap;
    transition:transform .1s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn-ink{
    background:linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color:#fff;
    box-shadow:0 6px 16px -4px #2856E866;
  }
  .btn-ink:hover:not(:disabled){ box-shadow:0 8px 20px -4px #2856E888; }
  .btn-ink:active:not(:disabled){ transform:translateY(1px); }
  .btn-ink:disabled{ background:#C7CEE0; box-shadow:none; cursor:not-allowed; }
  .btn-ghost{ background:#F2F4FA; color:var(--ink-muted); border:1.5px solid var(--border); }
  .btn-ghost:hover{ background:#E9ECF6; }
  .btn-accent{ background:var(--primary); color:#fff; }

  .hint{ font-size:12px; color:var(--ink-muted); margin:-4px 0 10px; }
  .chip.directory{ background:#F2F4FA; border:1px solid var(--border); color:var(--ink); cursor:pointer; padding:7px 14px; font-family:'Inter', sans-serif; font-weight:500; }
  .chip.directory:hover{ background:var(--primary-soft); border-color:var(--primary-soft-2); color:var(--primary-darker); }
  .member-row{
    display:flex; align-items:center; justify-content:space-between; width:100%;
    padding:13px 4px; border:none; border-bottom:1px solid var(--border); background:transparent;
    font-family:'Inter', sans-serif; font-size:15px; font-weight:500; color:var(--ink); text-align:left; cursor:pointer;
  }
  .member-row:last-child{ border-bottom:none; }
  .member-row:hover{ color:var(--primary-darker); background:var(--primary-soft); border-radius:10px; }
  .member-row .chev{ color:var(--ink-muted); font-size:20px; line-height:1; }
  .check-row{ display:flex; align-items:center; gap:8px; font-size:14px; font-weight:500; margin:2px 0 12px; cursor:pointer; }
  .check-row input{ width:16px; accent-color:var(--primary); }
  .btn-danger{ background:var(--negative-soft); color:var(--negative); margin-left:auto; }
  .btn-danger:hover{ background:#F9D9D6; }
  .chip.suggest{
    background:#fff; border:1.5px dashed var(--primary-soft-2); color:var(--primary-darker);
    cursor:pointer; padding:6px 14px;
  }
  .chip.suggest:hover{ background:var(--primary-soft); }
  .chip.suggest .plus{ font-weight:800; }

  .you-stats{ display:flex; gap:10px; margin-bottom:6px; }
  .stat-card{ flex:1; background:var(--primary-soft); border-radius:14px; padding:12px 14px; }
  .stat-card .stat-label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--primary-darker); opacity:.85; }
  .stat-card .stat-value{ font-family:'Manrope', sans-serif; font-weight:800; font-size:19px; margin-top:4px; color:var(--primary-darker); }
  .stat-card.owe{ background:var(--negative-soft); }
  .stat-card.owe .stat-label, .stat-card.owe .stat-value{ color:var(--negative); }
  .stat-card.get{ background:var(--positive-soft); }
  .stat-card.get .stat-label, .stat-card.get .stat-value{ color:var(--positive); }

  .tab-nav{ display:grid; grid-template-columns: repeat(4,1fr); gap:6px; margin:18px 0 16px; }
  .tab-btn{ border:1.5px solid var(--border); background:#fff; border-radius:12px; padding:9px 3px; font-size:11px; font-weight:700; color:var(--ink-muted); cursor:pointer; text-align:center; }
  .tab-btn.active{ background:var(--primary); border-color:var(--primary); color:#fff; }

  .you-prompt{ background:var(--primary-soft); border-radius:14px; padding:14px; margin-bottom:6px; font-size:13.5px; }
  .you-prompt select{ margin-top:8px; }

  .stat-row{ margin-bottom:14px; }
  .stat-row .srow-head{ display:flex; justify-content:space-between; font-size:13px; font-weight:600; margin-bottom:5px; gap:8px; }
  .stat-bar-track{ height:7px; background:var(--border); border-radius:6px; overflow:hidden; }
  .stat-bar-fill{ height:100%; border-radius:6px; }
  .stat-bar-fill.paid{ background:var(--primary); }
  .stat-bar-fill.cost{ background:#F5A524; }
  .stat-legend{ display:flex; gap:16px; font-size:11.5px; color:var(--ink-muted); margin-top:8px; }
  .stat-legend span::before{ content:''; display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:middle; }
  .legend-paid::before{ background:var(--primary); }
  .legend-cost::before{ background:#F5A524; }

  .you-btn{ background:none; border:1px solid var(--primary-soft-2); color:var(--primary-dark); font-size:10px; font-weight:700; padding:3px 8px; border-radius:10px; cursor:pointer; }
  .you-btn.active{ background:var(--primary); color:#fff; border-color:var(--primary); }

  .add-btn{
    display:flex; align-items:center; justify-content:center;
    position:fixed; right:22px; bottom:calc(22px + env(safe-area-inset-bottom, 0px)); z-index:50;
    width:56px; height:56px; margin:0; padding:0 0 3px;
    border:none; border-radius:50%; cursor:pointer;
    font-family:'Manrope', sans-serif; font-size:32px; font-weight:600; line-height:1; color:#fff;
    background:linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    box-shadow:0 10px 24px -6px #2856E8AA;
    transition:transform .1s ease, box-shadow .15s ease;
  }
  .add-btn:hover{ box-shadow:0 10px 22px -6px #2856E8AA; }
  .add-btn:active{ transform:scale(0.95); }

  .modal-overlay{
    position:fixed; inset:0; z-index:100;
    background:#101A3466; backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .modal{
    background:#fff; border-radius:22px; width:100%; max-width:420px;
    max-height:90vh; overflow:auto; padding:22px 22px 20px;
    box-shadow:0 30px 60px -20px #101A3488;
  }
  .modal-title{
    font-family:'Manrope', sans-serif; font-weight:800; font-size:18px;
    color:var(--primary-darker); margin-bottom:16px;
  }
  #modalRoot{ position:relative; }

  #printArea{ display:none; }
  @media print{
    #modalRoot{ display:none !important; }
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{ position:absolute; left:0; top:0; width:100%; padding:0; display:block; }
  }
  .print-title{ font-family:'Manrope', sans-serif; font-weight:800; font-size:20px; margin-bottom:2px; }
  .print-meta{ font-size:12px; color:#555; margin-bottom:16px; }
  .print-table{ width:100%; border-collapse:collapse; margin-bottom:18px; font-size:12.5px; }
  .print-table th, .print-table td{ border-bottom:1px solid #ddd; padding:6px 8px; text-align:left; }
  .print-section-title{ font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.5px; margin:18px 0 8px; color:#333; }

  /* Start screen: group cards */
  .group-card{
    display:flex; align-items:center; justify-content:space-between;
    border:1.5px solid var(--border); border-radius:16px;
    padding:16px 16px; margin-bottom:10px;
    background:#FAFBFF; cursor:pointer;
    transition:border-color .15s ease, transform .1s ease, box-shadow .15s ease;
  }
  .group-card:hover{
    border-color:var(--primary);
    box-shadow:0 8px 20px -10px #2856E855;
    transform:translateY(-1px);
  }
  .group-card .gname{
    font-family:'Manrope', sans-serif; font-weight:700; font-size:16.5px; color:var(--ink);
  }
  .group-card .gmeta{
    font-size:12.5px; color:var(--ink-muted); margin-top:3px;
    font-weight:500;
  }
  .group-card .gdel{
    background:none; border:none; color:var(--negative);
    font-size:12px; font-weight:600; cursor:pointer;
    padding:4px 0 0 10px; white-space:nowrap;
    opacity:0.75;
  }
  .group-card .gdel:hover{ opacity:1; }

  .expense{ padding: 12px 8px; margin:0 -8px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; cursor:pointer; border-radius:10px; transition:background .15s ease; }
  .expense:hover{ background:var(--primary-soft); }
  .expense-main{ flex:1; min-width:0; }
  .expense-actions{ display:flex; gap:2px; flex-shrink:0; margin-left:auto; }
  .icon-btn{ width:34px; height:34px; display:flex; align-items:center; justify-content:center; border:none; background:transparent; border-radius:10px; cursor:pointer; color:var(--ink-muted); transition:background .15s ease, color .15s ease; }
  .icon-btn svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .icon-btn.edit:hover{ background:var(--primary-soft); color:var(--primary-dark); }
  .icon-btn.del:hover{ background:var(--negative-soft); color:var(--negative); }
  .expense:last-child{ border-bottom:none; }
  .line{ display:flex; align-items:baseline; gap:6px; }
  .line .label{ font-size:14.5px; font-weight:600; white-space:nowrap; }
  .line .fill{ flex:1; }
  .line .value{ font-family:'Manrope', sans-serif; font-size:15px; font-weight:700; color:var(--primary-darker); white-space:nowrap; }
  .expense-meta{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:4px; font-size:12px; color:var(--ink-muted);
  }
  .empty-note{ font-size:13.5px; color:var(--ink-muted); padding:10px 0 4px; }

  .total-bar{
    display:flex; justify-content:space-between; align-items:baseline;
    background:linear-gradient(135deg, var(--primary) 0%, var(--primary-darker) 100%);
    color:#fff; padding:16px 18px; border-radius:16px; margin-top:6px;
    box-shadow:0 10px 24px -10px #2856E877;
  }
  .total-bar .lbl{ font-family:'Manrope', sans-serif; font-size:11.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase; opacity:0.8; }
  .total-bar .amt{ font-family:'Manrope', sans-serif; font-size:21px; font-weight:800; }

  .toggle-form-btn{
    width:100%; padding:13px; border:1.5px dashed var(--primary-soft-2); border-radius:14px;
    background:var(--primary-soft); color:var(--primary-darker); font-weight:700; font-size:13.5px; cursor:pointer;
    transition:background .15s ease;
  }
  .toggle-form-btn:hover{ background:var(--primary-soft-2); }
  .form-panel{ border:1.5px solid var(--border); border-radius:16px; padding:16px; margin-top:12px; background:#FAFBFF; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:11.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:var(--ink-muted); margin-bottom:5px; }
  .mode-tabs{ display:flex; border:1.5px solid var(--border); border-radius:12px; overflow:hidden; background:#fff; }
  .mode-tabs button{
    flex:1; border:none; background:transparent; padding:9px 4px; font-size:12px; font-weight:700;
    color:var(--ink-muted); cursor:pointer; border-right:1px solid var(--border);
    transition:background .15s ease, color .15s ease;
  }
  .mode-tabs button:last-child{ border-right:none; }
  .mode-tabs button.active{ background:var(--primary); color:#fff; }
  .participant-row{ display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); }
  .participant-row:last-child{ border-bottom:none; }
  .participant-row .pname{ flex:1; font-size:14px; font-weight:500; display:flex; align-items:center; gap:8px; }
  .participant-row input[type=checkbox]{ width:16px; accent-color:var(--primary); }
  .participant-row input[type=number]{ width:80px; text-align:right; font-family:'Manrope', sans-serif; padding:8px 10px; }
  .validation-msg{ font-size:12.5px; margin-top:8px; font-weight:600; }
  .validation-msg.ok{ color:var(--positive); }
  .validation-msg.bad{ color:var(--negative); }
  .form-actions{ display:flex; gap:8px; margin-top:14px; }
  .form-actions.icon-actions .btn{ flex:1; margin:0; display:flex; align-items:center; justify-content:center; padding:12px 0; }
  .form-actions.icon-actions .btn svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }

  .balance-row{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); font-size:14.5px; font-weight:500; }
  .balance-row:last-child{ border-bottom:none; }
  .balance-row .amt{ font-family:'Manrope', sans-serif; font-weight:700; }
  .amt.pos{ color:var(--positive); }
  .amt.neg{ color:var(--negative); }
  .amt.zero{ color:var(--ink-muted); }

  .settle-row{
    display:flex; align-items:center; gap:8px; font-size:14px; font-weight:500;
    padding:10px 12px; margin-bottom:6px;
    background:var(--primary-soft); border-radius:12px;
  }
  .settle-row .arrow{ color:var(--primary); font-weight:700; }
  .settle-row .amt{ margin-left:auto; font-family:'Manrope', sans-serif; font-weight:800; color:var(--primary-darker); }

  footer.stub{
    text-align:center; padding:18px 0 22px;
    font-family:'Inter', sans-serif; font-size:11px; font-weight:600; letter-spacing:0.3px; color:var(--ink-muted);
  }
  .reset-link{ text-align:center; margin-top:14px; }
  .reset-link button{ background:none;border:none;color:var(--ink-muted); font-size:12px; font-weight:600; cursor:pointer; }
  .reset-link button:hover{ color:var(--negative); }
</style>
</head>
<body>

<div class="receipt-wrap">
  <div class="receipt">

    <header class="masthead">
      <button class="back-btn" id="backBtn">‹ Gruppen</button>
      <p class="wordmark">splitt<span class="dot">’</span>it</p>
      <p class="subtitle" id="subtitle">Gruppenkasse</p>
    </header>
    <p id="storageStatus"></p>

    <div id="mainContent"></div>

    <footer class="stub">Alle Beträge in CHF</footer>
  </div>
</div>

<div id="printArea"></div>
<div id="modalRoot"></div>


<script>
const STORAGE_KEY = 'splittr-data';
let state = { people: [], groups: [], currentUserId: null };
let currentGroupId = null;
let showMembersView = false;
let activeTab = 'ausgaben'; // 'ausgaben' | 'mitglieder' | 'statistik' | 'ausgleich'
let formMode = 'equal';
let formOpen = false;
let editingExpenseId = null;
let formDraft = null;
let modalOnClose = null;
let storageBackend = 'none'; // 'artifact' | 'local' | 'none'

function uid(){ return Math.random().toString(36).slice(2,10); }
function fmt(n){
  const sign = n < 0 ? '-' : '';
  return sign + 'CHF ' + Math.abs(n).toFixed(2);
}
function getGroup(){ return state.groups.find(g => g.id === currentGroupId) || null; }
function isYou(id){ return state.currentUserId === id; }
function nowParts(){
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return { date: `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, time: `${pad(d.getHours())}:${pad(d.getMinutes())}` };
}
function fmtDate(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  return m ? `${m[3]}.${m[2]}.${m[1]}` : '';
}
function esc(str){ return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* ---------- Separates Eingabefenster (Modal) ---------- */
function openModal(title, bodyHtml, onClose){
  const root = document.getElementById('modalRoot');
  modalOnClose = onClose || null;
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-title">${title}</div>
        <div id="modalBody">${bodyHtml}</div>
      </div>
    </div>`;
  document.getElementById('modalOverlay').addEventListener('mousedown', (e) => {
    if(e.target.id === 'modalOverlay') closeModal();
  });
}
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
  const cb = modalOnClose; modalOnClose = null;
  if(cb) cb();
}
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && document.getElementById('modalOverlay')) closeModal();
});

function openAddGroupModal(){
  openModal('Neue Gruppe', `
    <div class="field">
      <label>Name der Gruppe</label>
      <input id="m_groupName" type="text" maxlength="30" placeholder="z.B. Wanderwochenende">
    </div>
    <div class="form-actions">
      <button class="btn btn-ink" id="m_save">Erstellen</button>
      <button class="btn btn-ghost" id="m_cancel">Abbrechen</button>
    </div>`);
  const input = document.getElementById('m_groupName');
  const submit = () => {
    const v = input.value.trim();

function setStorageStatus(text, isWarning){
  const el = document.getElementById('storageStatus');

  el.style.color = isWarning ? 'var(--negative)' : 'var(--ink-muted)';
}

/* Migriert ältere Datenformate auf die aktuelle Struktur. */
function migrateState(){
  if(!Array.isArray(state.people)) state.people = [];
  if(!Array.isArray(state.groups)) state.groups = [];
  if(state.currentUserId === undefined) state.currentUserId = null;
  sortPeople();
  state.groups.forEach(g => {
    if(Array.isArray(g.members)){
      const idMap = {};
      g.members.forEach(m => {
        let person = state.people.find(p => p.name.toLowerCase() === m.name.toLowerCase());
        if(!person){ person = { id: uid(), name: m.name }; state.people.push(person); }
        idMap[m.id] = person.id;
      });
      g.memberIds = g.members.map(m => idMap[m.id]);
      g.expenses.forEach(e => {
        e.paidBy = idMap[e.paidBy] || e.paidBy;
        e.participants.forEach(p => { p.id = idMap[p.id] || p.id; });
      });
      delete g.members;
    }
    if(!Array.isArray(g.memberIds)) g.memberIds = [];
  });
}

async function loadState(){
  if(typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function'){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value) state = JSON.parse(res.value);
      storageBackend = 'artifact';
      migrateState(); render();
      return;
    }catch(e){
      storageBackend = 'artifact';
      migrateState(); render();
      return;
    }
  }
  try{
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if(raw) state = JSON.parse(raw);
    storageBackend = 'local';
  }catch(e){
    storageBackend = 'none';
    setStorageStatus('⚠ Kein Speicher verfügbar — Daten gehen beim Schliessen verloren.', true);
  }
  migrateState(); render();
}

async function saveState(){
  if(storageBackend === 'artifact'){
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); return; }
    catch(e){ console.error('Artifact-Speicher fehlgeschlagen, versuche localStorage', e); storageBackend = 'local'; }
  }
  if(storageBackend === 'local'){
    try{ window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); return; }
    catch(e){ storageBackend = 'none'; setStorageStatus('⚠ Speichern fehlgeschlagen — Daten gehen beim Schliessen verloren.', true); }
  }
}

/* ---------- Zentrale Mitgliederliste ---------- */

function sortPeople(){
  state.people.sort((a,b) => a.name.localeCompare(b.name, 'de', { sensitivity:'base' }));
}

function findPersonByName(name){ return state.people.find(p => p.name.toLowerCase() === name.trim().toLowerCase()); }

function addPersonGlobal(name){
  name = name.trim();
  if(!name) return null;
  let person = findPersonByName(name);
  if(!person){ person = { id: uid(), name }; state.people.push(person); sortPeople(); saveState(); }
  return person;
}

function deletePersonGlobally(id){
  const person = state.people.find(p => p.id === id);
  if(!person) return false;
  if(!confirm(`"${person.name}" komplett löschen? Wird aus allen Gruppen und Ausgaben entfernt.`)) return false;
  state.people = state.people.filter(p => p.id !== id);
  state.groups.forEach(g => {
    g.memberIds = g.memberIds.filter(mid => mid !== id);
    g.expenses = g.expenses.filter(e => e.paidBy !== id);
    g.expenses.forEach(e => { e.participants = e.participants.filter(p => p.id !== id); });
  });
  if(state.currentUserId === id) state.currentUserId = null;
  saveState(); render();
  return true;
}

function setCurrentUser(id){ state.currentUserId = id; saveState(); render(); }
function personName(id){ const p = state.people.find(p => p.id === id); return p ? p.name : '?'; }
function groupMembers(g){ return g.memberIds.map(id => state.people.find(p => p.id === id)).filter(Boolean); }

function createGroup(name){

function addMemberToGroup(name){
  const g = getGroup();
  name = name.trim();
  if(!g || !name) return;
  const person = addPersonGlobal(name);
  if(!person) return;
  if(!g.memberIds.includes(person.id)) g.memberIds.push(person.id);
  saveState(); render();
}

function addExistingPersonToGroup(personId){
  const g = getGroup();
  if(!g) return;
  if(!g.memberIds.includes(personId)) g.memberIds.push(personId);
  saveState(); render();
}

function removeMemberFromGroup(id){
  const g = getGroup();
  if(!g) return;
  g.memberIds = g.memberIds.filter(mid => mid !== id);
  g.expenses = g.expenses.filter(e => e.paidBy !== id);
  g.expenses.forEach(e => { e.participants = e.participants.filter(p => p.id !== id); });
  saveState(); render();
}

function removeExpense(id){
  const g = getGroup();
  if(!g) return;
  g.expenses = g.expenses.filter(e => e.id !== id);
  saveState(); render();
}

function computeShares(expense){
  const amount = expense.amount;
  const parts = expense.participants;
  const shares = {};
  if(expense.mode === 'equal'){
    const each = amount / parts.length;
    parts.forEach(p => shares[p.id] = each);
  } else if(expense.mode === 'percent'){
    parts.forEach(p => shares[p.id] = amount * (p.value / 100));
  } else if(expense.mode === 'amount'){
    parts.forEach(p => shares[p.id] = p.value);
  } else if(expense.mode === 'weight'){
    const totalW = parts.reduce((s,p) => s + p.value, 0) || 1;
    parts.forEach(p => shares[p.id] = amount * (p.value / totalW));
  }
  return shares;
}

function computeBalances(g){
  const balances = {};
  g.memberIds.forEach(id => balances[id] = 0);
  g.expenses.forEach(e => {
    if(balances[e.paidBy] === undefined) return;
    balances[e.paidBy] += e.amount;
    const shares = computeShares(e);
    Object.keys(shares).forEach(pid => { if(balances[pid] !== undefined) balances[pid] -= shares[pid]; });
  });
  Object.keys(balances).forEach(id => balances[id] = Math.round(balances[id]*100)/100);
  return balances;
}

function computeSettlements(balances){
  const creditors = [], debtors = [];
  Object.entries(balances).forEach(([id, amt]) => {
    if(amt > 0.01) creditors.push({ id, amt });
    else if(amt < -0.01) debtors.push({ id, amt: -amt });
  });
  creditors.sort((a,b) => b.amt - a.amt);
  debtors.sort((a,b) => b.amt - a.amt);
  const txns = [];
  let i = 0, j = 0;
  while(i < debtors.length && j < creditors.length){
    const d = debtors[i], c = creditors[j];
    const amt = Math.min(d.amt, c.amt);
    if(amt > 0.01) txns.push({ from: d.id, to: c.id, amount: Math.round(amt*100)/100 });
    d.amt -= amt; c.amt -= amt;
    if(d.amt < 0.01) i++;
    if(c.amt < 0.01) j++;
  }
  return txns;
}

  openModal(editingExpense ? 'Ausgabe bearbeiten' : 'Neue Ausgabe', `
    <div class="field">
      <label>Beschreibung</label>
      <input id="f_desc" type="text" placeholder="z.B. Abendessen" maxlength="40" value="${esc(descVal)}">
    </div>
    <div class="field">
      <label>Betrag (CHF)</label>
      <input id="f_amount" type="number" step="0.05" min="0" placeholder="0.00" value="${esc(amountVal)}">
    </div>
    <div class="field">
      <label>Datum &amp; Zeit</label>
      <div style="display:flex; gap:8px;">
        <input id="f_date" type="date" value="${esc(dateVal)}">
        <input id="f_time" type="time" value="${esc(timeVal)}" style="max-width:130px;">
      </div>
    </div>
    <div class="field">
      <label>Bezahlt von</label>
      <select id="f_paidby">
        ${members.map(m => `<option value="${m.id}" ${paidByVal === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Aufteilung</label>
      <div class="mode-tabs" id="modeTabs">
        ${Object.entries(modeLabels).map(([k,v]) => `<button data-mode="${k}" class="${k===formMode?'active':''}">${v}</button>`).join('')}
      </div>
    </div>
    <div class="field">
      <label>Teilnehmer</label>
      <div id="participantsBox"></div>
    </div>
    <div class="validation-msg" id="validationMsg"></div>
    <div class="form-actions icon-actions">
      <button class="btn btn-ink" id="saveExpenseBtn" title="${editingExpense ? 'Änderungen speichern' : 'Speichern'}" aria-label="${editingExpense ? 'Änderungen speichern' : 'Speichern'}"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <button class="btn btn-ghost" id="cancelExpenseBtn" title="Abbrechen" aria-label="Abbrechen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button>
      ${editingExpense ? '<button class="btn btn-danger" id="deleteExpenseBtn" title="Löschen" aria-label="Löschen"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button>' : ''}
    </div>
  `, onClose);

  document.getElementById('modeTabs').querySelectorAll('button').forEach(b => {
    b.onclick = () => { captureFormDraft(); formMode = b.dataset.mode; openExpenseModal(g); };
  });

  const pBox = document.getElementById('participantsBox');
  members.forEach(m => {
    const row = document.createElement('div');
    row.className = 'participant-row';
    const isChecked = formDraft ? formDraft.checked.includes(m.id) : (editingExpense ? (m.id in partMap) : true);
    const keepValue = editingExpense && formMode === editingExpense.mode && (m.id in partMap);
    const prefillValue = keepValue ? partMap[m.id] : '';
    let inputHtml = '';
    if(formMode === 'percent') inputHtml = `<input type="number" class="p-value" data-id="${m.id}" placeholder="%" step="1" value="${prefillValue}">`;
    else if(formMode === 'amount') inputHtml = `<input type="number" class="p-value" data-id="${m.id}" placeholder="CHF" step="0.05" value="${prefillValue}">`;
    else if(formMode === 'weight') inputHtml = `<input type="number" class="p-value" data-id="${m.id}" placeholder="Anteile" step="1" value="${prefillValue}">`;
    row.innerHTML = `
      <span class="pname"><input type="checkbox" class="p-check" data-id="${m.id}" ${isChecked ? 'checked' : ''}> ${esc(m.name)}</span>
      ${inputHtml}
    `;
    pBox.appendChild(row);
  });

  pBox.querySelectorAll('.p-check, .p-value').forEach(el => el.addEventListener('input', validateForm));
  document.getElementById('f_amount').addEventListener('input', validateForm);
  document.getElementById('saveExpenseBtn').onclick = () => saveExpense(g);
  document.getElementById('cancelExpenseBtn').onclick = closeModal;
  const delBtn = document.getElementById('deleteExpenseBtn');
  if(delBtn && editingExpense){
    const delId = editingExpense.id;
    delBtn.onclick = () => {
      if(!confirm('Ausgabe «' + editingExpense.desc + '» wirklich löschen?')) return;
      closeModal();
      removeExpense(delId);
    };
  }

  validateForm();
}

function getFormParticipants(){
  const checks = Array.from(document.querySelectorAll('.p-check')).filter(c => c.checked);
  return checks.map(c => {
    const id = c.dataset.id;
    let value = 1;
    if(formMode !== 'equal'){
      const valInput = document.querySelector(`.p-value[data-id="${id}"]`);
      value = valInput ? parseFloat(valInput.value) || 0 : 0;
    }
    return { id, value };
  });
}

function validateForm(){
  const msgEl = document.getElementById('validationMsg');
  const saveBtn = document.getElementById('saveExpenseBtn');
  if(!msgEl || !saveBtn) return;
  const amount = parseFloat(document.getElementById('f_amount').value) || 0;
  const parts = getFormParticipants();

  if(parts.length === 0){
    msgEl.textContent = 'Mindestens eine Person auswählen.';
    msgEl.className = 'validation-msg bad'; saveBtn.disabled = true; return;
  }
  if(amount <= 0){
    msgEl.textContent = 'Betrag muss grösser als 0 sein.';
    msgEl.className = 'validation-msg bad'; saveBtn.disabled = true; return;
  }

  if(formMode === 'equal'){
    msgEl.textContent = `Je ${fmt(amount / parts.length)} pro Person.`;
    msgEl.className = 'validation-msg ok'; saveBtn.disabled = false;
  } else if(formMode === 'percent'){
    const sum = parts.reduce((s,p) => s + p.value, 0);
    const diff = Math.round((100 - sum) * 100) / 100;
    if(Math.abs(diff) < 0.5){ msgEl.textContent = 'Prozente ergeben 100%.'; msgEl.className = 'validation-msg ok'; saveBtn.disabled = false; }
    else { msgEl.textContent = `Prozente ergeben ${sum}% — Differenz ${diff}%.`; msgEl.className = 'validation-msg bad'; saveBtn.disabled = true; }
  } else if(formMode === 'amount'){
    const sum = parts.reduce((s,p) => s + p.value, 0);
    const diff = Math.round((amount - sum) * 100) / 100;
    if(Math.abs(diff) < 0.02){ msgEl.textContent = 'Beträge ergeben den Gesamtbetrag.'; msgEl.className = 'validation-msg ok'; saveBtn.disabled = false; }
    else { msgEl.textContent = `Beträge ergeben ${fmt(sum)} — Differenz ${fmt(diff)}.`; msgEl.className = 'validation-msg bad'; saveBtn.disabled = true; }
  } else if(formMode === 'weight'){
    const sum = parts.reduce((s,p) => s + p.value, 0);
    if(sum > 0){ msgEl.textContent = `Total ${sum} Anteile.`; msgEl.className = 'validation-msg ok'; saveBtn.disabled = false; }
    else { msgEl.textContent = 'Mindestens ein Anteil grösser als 0 nötig.'; msgEl.className = 'validation-msg bad'; saveBtn.disabled = true; }
  }
}

function saveExpense(g){
  const desc = document.getElementById('f_desc').value.trim() || 'Ausgabe';
  const amount = parseFloat(document.getElementById('f_amount').value) || 0;
  const paidBy = document.getElementById('f_paidby').value;
  const parts = getFormParticipants();
  let date = document.getElementById('f_date').value;
  let time = document.getElementById('f_time').value;
  if(!editingExpenseId){
    const nowP = nowParts();
    if(!date) date = nowP.date;
    if(!time) time = nowP.time;
  }

  if(editingExpenseId){
    const existing = g.expenses.find(e => e.id === editingExpenseId);
    if(existing){
      existing.desc = desc;
      existing.amount = Math.round(amount*100)/100;
      existing.paidBy = paidBy;
      existing.date = date;
      existing.time = time;
      existing.mode = formMode;
      existing.participants = parts;
    }
  } else {
    g.expenses.push({ id: uid(), desc, amount: Math.round(amount*100)/100, paidBy, date, time, mode: formMode, participants: parts });
  }

  closeModal();
  saveState(); render();
}

/* --- Tab: Mitglieder --- */
function renderMitgliederTab(g, wrap){
  wrap.innerHTML = `
    <div class="section-title" style="margin-top:0;">In dieser Gruppe</div>
    <div id="membersRow" class="members-row"></div>
    <button class="add-btn" id="addMemberBtn" title="Mitglied hinzufügen" aria-label="Mitglied hinzufügen">+</button>
  `;
  document.getElementById('addMemberBtn').onclick = openAddMemberModal;
  renderMembers(g);
}

function renderMembers(g){
  const row = document.getElementById('membersRow');
  if(!row) return;
  const members = groupMembers(g);
  row.innerHTML = '';
  if(members.length === 0){
    row.innerHTML = '<p class="empty-note">Noch keine Teilnehmer — mit + hinzufügen.</p>';
  } else {
    members.forEach(m => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.innerHTML = `<span>${m.name}</span>`;
      const removeBtn = document.createElement('button');
      removeBtn.textContent = '×';
      removeBtn.title = 'Aus dieser Gruppe entfernen';
      removeBtn.onclick = () => removeMemberFromGroup(m.id);
      chip.appendChild(removeBtn);
      row.appendChild(chip);
    });
  }
}

function renderDirectory(){
  const row = document.getElementById('directoryRow');
  if(!row) return;
  sortPeople();
  if(state.people.length === 0){ row.innerHTML = '<p class="empty-note">Noch keine Mitglieder — mit + erfassen.</p>'; return; }
  row.innerHTML = state.people.map(p =>
    `<button class="member-row" data-id="${p.id}"><span>${esc(p.name)}</span><span class="chev">›</span></button>`
  ).join('');
  row.querySelectorAll('.member-row').forEach(btn => {
    btn.addEventListener('click', () => openEditPersonModal(btn.dataset.id));
  });
}

/* --- Tab: Statistik --- */
function renderStatistikTab(g, wrap){
  const members = groupMembers(g);
  if(members.length === 0){ wrap.innerHTML = '<p class="empty-note">Keine Teilnehmer vorhanden.</p>'; return; }

  const paid = {}, cost = {};
  members.forEach(m => { paid[m.id] = 0; cost[m.id] = 0; });
  g.expenses.forEach(e => {
    if(paid[e.paidBy] !== undefined) paid[e.paidBy] += e.amount;
    const shares = computeShares(e);
    Object.keys(shares).forEach(pid => { if(cost[pid] !== undefined) cost[pid] += shares[pid]; });
  });
  const total = g.expenses.reduce((s,e) => s + e.amount, 0);
  const maxVal = Math.max(1, ...members.map(m => Math.max(paid[m.id]||0, cost[m.id]||0)));

  let topSpender = members[0];
  members.forEach(m => { if((paid[m.id]||0) > (paid[topSpender.id]||0)) topSpender = m; });

  const rows = members.map(m => {
    const p = paid[m.id]||0, c = cost[m.id]||0;
    return `
      <div class="stat-row">
        <div class="srow-head"><span>${m.name}</span><span>${fmt(p)} bezahlt · ${fmt(c)} Kosten</span></div>
        <div class="stat-bar-track"><div class="stat-bar-fill paid" style="width:${(p/maxVal*100).toFixed(1)}%"></div></div>
        <div class="stat-bar-track" style="margin-top:3px;"><div class="stat-bar-fill cost" style="width:${(c/maxVal*100).toFixed(1)}%"></div></div>
      </div>
    `;
  }).join('');

  wrap.innerHTML = `
    <div class="you-stats" style="margin-bottom:18px;">
      <div class="stat-card"><div class="stat-label">Gesamtausgaben</div><div class="stat-value">${fmt(total)}</div></div>
      <div class="stat-card"><div class="stat-label">Anzahl Ausgaben</div><div class="stat-value">${g.expenses.length}</div></div>
    </div>
    ${rows}
    <div class="stat-legend">
      <span class="legend-paid">Bezahlt</span>
      <span class="legend-cost">Kosten (Anteil)</span>
    </div>
    ${g.expenses.length ? `<p class="hint" style="margin-top:14px;">Meiste Auslagen: <strong>${topSpender.name}</strong> (${fmt(paid[topSpender.id]||0)})</p>` : ''}
  `;
}

/* --- Tab: Ausgleich --- */
function renderAusgleichTab(g, wrap){
  wrap.innerHTML = `
    <div class="section-title" style="margin-top:0;">Salden</div>
    <div id="balancesList"></div>
    <div class="section-title">Ausgleichszahlungen</div>
    <div id="settleList"></div>
    <button class="btn btn-ink" id="exportPdfBtn" style="margin-top:16px;width:100%;">📄 Zusammenfassung als PDF exportieren</button>
    <p class="hint" style="text-align:center;margin-top:8px;">Öffnet den Druckdialog — dort "Als PDF speichern" wählen.</p>
  `;
  document.getElementById('exportPdfBtn').onclick = () => exportGroupPdf(g);
  renderBalances(g);
}

function renderBalances(g){
  const balances = computeBalances(g);
  const list = document.getElementById('balancesList');
  if(!list) return;
  const members = groupMembers(g);
  list.innerHTML = '';
  if(members.length === 0){
    list.innerHTML = '<p class="empty-note">Keine Teilnehmer vorhanden.</p>';
  } else {
    members.forEach(m => {
      const b = balances[m.id] ?? 0;
      const cls = b > 0.01 ? 'pos' : b < -0.01 ? 'neg' : 'zero';
      const label = b > 0.01 ? 'bekommt' : b < -0.01 ? 'schuldet' : 'ausgeglichen';
      const rowEl = document.createElement('div');
      rowEl.className = 'balance-row';
      rowEl.innerHTML = `<span>${m.name} <span style="color:var(--ink-muted);font-size:12px;">(${label})</span></span><span class="amt ${cls}">${fmt(Math.abs(b))}</span>`;
      list.appendChild(rowEl);
    });
  }

  const settleList = document.getElementById('settleList');
  if(settleList){
    settleList.innerHTML = '';
    const txns = computeSettlements(balances);
    if(txns.length === 0){
      settleList.innerHTML = '<p class="empty-note">Kein Ausgleich nötig.</p>';
    } else {
      txns.forEach(t => {
        const rowEl = document.createElement('div');
        rowEl.className = 'settle-row';
        rowEl.innerHTML = `<span>${personName(t.from)}</span><span class="arrow">→</span><span>${personName(t.to)}</span><span class="amt">${fmt(t.amount)}</span>`;
        settleList.appendChild(rowEl);
      });
    }
  }
}

/* --- PDF-Export (via Browser-Druck) --- */
function exportGroupPdf(g){
  const balances = computeBalances(g);
  const txns = computeSettlements(balances);
  const members = groupMembers(g);
  const total = g.expenses.reduce((s,e) => s + e.amount, 0);
  const now = new Date().toLocaleDateString('de-CH');

  const expenseRows = g.expenses.map(e => {
    const modeLabel = {equal:'Gleich', percent:'Prozent', amount:'Betrag', weight:'Anteile'}[e.mode];
    return `<tr><td>${[fmtDate(e.date), e.time || ''].filter(Boolean).join(' ')}</td><td>${esc(e.desc)}</td><td>${fmt(e.amount)}</td><td>${esc(personName(e.paidBy))}</td><td>${modeLabel}</td></tr>`;
  }).join('') || '<tr><td colspan="5">Keine Ausgaben.</td></tr>';

  const balanceRows = members.map(m => {
    const b = balances[m.id] ?? 0;
    const label = b > 0.01 ? 'bekommt' : b < -0.01 ? 'schuldet' : 'ausgeglichen';
    return `<tr><td>${m.name}</td><td>${label}</td><td>${fmt(Math.abs(b))}</td></tr>`;
  }).join('');

  const settleRows = txns.length
    ? txns.map(t => `<tr><td>${personName(t.from)}</td><td>→</td><td>${personName(t.to)}</td><td>${fmt(t.amount)}</td></tr>`).join('')
    : '<tr><td colspan="4">Kein Ausgleich nötig.</td></tr>';

  document.getElementById('printArea').innerHTML = `
    <div class="print-title">Splitt'it — ${g.name}</div>
    <div class="print-meta">Erstellt am ${now} · ${members.length} Mitglieder · Total ${fmt(total)}</div>

    <div class="print-section-title">Ausgaben</div>
    <table class="print-table">
      <thead><tr><th>Datum / Zeit</th><th>Beschreibung</th><th>Betrag</th><th>Bezahlt von</th><th>Aufteilung</th></tr></thead>
      <tbody>${expenseRows}</tbody>
    </table>

    <div class="print-section-title">Salden</div>
    <table class="print-table">
      <thead><tr><th>Person</th><th>Status</th><th>Betrag</th></tr></thead>
      <tbody>${balanceRows}</tbody>
    </table>

    <div class="print-section-title">Ausgleichszahlungen</div>
    <table class="print-table">
      <thead><tr><th>Von</th><th></th><th>An</th><th>Betrag</th></tr></thead>
      <tbody>${settleRows}</tbody>
    </table>
  `;

  setTimeout(() => window.print(), 50);
}

function updateHeaderOffset(){
  const h = document.querySelector('header.masthead');
  if(h) document.documentElement.style.setProperty('--head-h', h.offsetHeight + 'px');
}
window.addEventListener('resize', updateHeaderOffset);
if(window.ResizeObserver) new ResizeObserver(updateHeaderOffset).observe(document.querySelector('header.masthead'));
updateHeaderOffset();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

loadState();
</script>
